<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CIPAT: Choose your character</title><link rel="icon" href="../assets/img/logo-pixel.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="pg">
<header class="top"><a class="brand" href="../index.html"><img class="brand-mark" src="../assets/img/logo-pixel.svg" alt=""><span>CIPAT</span></a><div><a href="majors.html" class="link">Majors</a></div></header>
<main class="page">
  <h1>Choose your character</h1>
  <p class="lede">This is who you will play as. Tap one to meet them.</p>
  <div class="chars">
    <button type="button" class="pick" data-c="boy" aria-pressed="false" aria-label="Choose Cipi">
      <span class="tri" aria-hidden="true"></span>
      <span class="fig">
        <img class="c-idle" src="../assets/img/characters/cipi-idle.png" alt="">
        <img class="c-wave" src="../assets/img/characters/cipi-wave.png" alt="" loading="lazy">
      </span>
      <span class="plate"><b>Cipi</b><small>Curious mind</small></span>
      <span class="spr cipi" aria-hidden="true"></span>
    </button>
    <button type="button" class="pick" data-c="girl" aria-pressed="false" aria-label="Choose Cita">
      <span class="tri" aria-hidden="true"></span>
      <span class="fig">
        <img class="c-idle" src="../assets/img/characters/cita-idle.png" alt="">
        <img class="c-wave" src="../assets/img/characters/cita-wave.png" alt="" loading="lazy">
      </span>
      <span class="plate"><b>Cita</b><small>Big dreamer</small></span>
      <span class="spr cita" aria-hidden="true"></span>
    </button>
  </div>
  <button type="button" id="go" class="btn" disabled>Choose this character</button>
  <p id="msg" class="msg" role="alert"></p>
</main>
<script src="../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/pages/character.js"></script>
</body>
</html>
