<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CIPAT: Choose a major</title><link rel="icon" href="../assets/img/logo-pixel.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="pg majors-pg">
<header class="top">
  <a class="brand" href="../index.html"><img class="brand-mark" src="../assets/img/logo-pixel.svg" alt=""><span>CIPAT</span></a>
  <div><a href="dashboard.html" class="link">My reports</a><span id="hello">Hi</span><button type="button" id="out">Log out</button></div>
</header>
<main class="page">
  <div id="picker">
    <div class="pg-head">
      <h1>Choose a major to explore</h1>
      <p class="lede">Pick one to step inside, or tell us a bit about yourself and we will suggest a few.</p>
    </div>

    <section class="helper">
      <img class="helper-mascot" src="../assets/img/logo-pixel.svg" alt="" width="72" height="49">
      <h2>Not sure where to start?</h2>
      <label for="interest">Tell us what you love, what you are good at, or the job you imagine.</label>
      <p class="chips-cap">Need an idea? Tap one:</p>
      <div id="chips" class="chips"></div>
      <textarea id="interest" maxlength="500" placeholder="For example: I like solving puzzles and I want to build apps."></textarea>
      <div id="count" class="count">0 / 500</div>
      <button type="button" id="suggest" class="btn">Suggest majors</button>
      <div id="thinking" class="thinking" hidden><i></i><i></i><i></i><span>Finding majors for you</span></div>
      <div id="found" hidden>
        <h3 class="res-title">Suggested for you</h3>
        <div id="results" class="grid"></div>
      </div>
    </section>

    <h2 class="sec-title">All majors</h2>
    <div id="grid" class="grid"></div>

    <h2 class="sec-title">Coming soon</h2>
    <ul id="soon" class="soon-row"></ul>
  </div>

  <p id="msg" class="msg" role="alert"></p>
</main>
<script src="../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ai.js"></script>
<script src="../js/pages/majors.js"></script>
</body>
</html>
