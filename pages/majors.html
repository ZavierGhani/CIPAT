<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CIPAT: Choose a major</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body class="pg">
<header class="top">   <div><a href="dashboard.html" class="link">My reports</a><span id="hello">Hi</span><button type="button" id="out">Log out</button></div>
  <a class="brand" href="../index.html">CIPAT</a>

</header>
<main class="page">
  <div id="picker">
    <h1>Choose a major to explore</h1>
    <p class="lede">Pick one to step inside, or tell us a bit about yourself and we will suggest a few.</p>

    <section class="helper">
      <h2>Not sure where to start?</h2>
      <label for="interest">Tell us what you love, what you are good at, or the job you imagine.</label>
      <textarea id="interest" maxlength="500" placeholder="For example: I like solving puzzles and I want to build apps."></textarea>
      <button type="button" id="suggest" class="btn">Suggest majors</button>
      <div id="results" class="grid" hidden></div>
    </section>

    <h2 class="sec-title">All majors</h2>
    <div id="grid" class="grid"></div>
  </div>

  <section id="picked" class="picked" hidden>
    <h1>Great choice: <span id="picked-name"></span></h1>
    <p>Choosing your character comes in the next build step. Your pick is already saved.</p>
    <a class="btn alt" href="majors.html">Pick another major</a>
  </section>

  <p id="msg" class="msg" role="alert"></p>
</main>
<script src="../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ai.js"></script>
<script src="../js/pages/majors.js"></script>
</body>
</html>
